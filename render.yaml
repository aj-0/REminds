services:
  - type: web
    name: telegram-reminder-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        value: sqlite:///reminders.db
      - key: PORT
        value: 10000
    disk:
      name: reminder-data
      mountPath: /data
      sizeGB: 1
