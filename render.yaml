services:
  - type: web
    name: telegram-reminder-bot
    runtime: python3
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --workers 1 --threads 4 --timeout 120 main:flask_app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BOT_TOKEN
        sync: false # Set in Render Dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: reminder-db
          property: connectionString
    # Optional: Persistent Disk for SQLite if not using Postgres
    # disk:
    #   name: data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1

databases:
  - name: reminder-db
    databaseName: reminders
    user: reminder_user
    plan: free # Or starter
